name: 'Maintainer'
description: 'Automatic maintenance for your repository. Triages issues, drafts fix PRs, and keeps an overview across your projects.'
author: 'ugurkoc'

branding:
  icon: 'tool'
  color: 'purple'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key. Set as a repository or organization secret named ANTHROPIC_API_KEY and pass it through the workflow.'
    required: true
  github-token:
    description: 'GitHub token for repo writes. If omitted, the auto-injected GITHUB_TOKEN of the workflow is used.'
    required: false
  mode:
    description: 'Run mode. One of: auto (default, route by event), dashboard (cross-repo aggregation only), triage-only, fix-only.'
    required: false
    default: 'auto'
  config-path:
    description: 'Path to the maintainer config file inside the repo.'
    required: false
    default: '.github/maintainer.yml'
  supabase-url:
    description: 'Supabase project URL. When provided alongside supabase-secret-key, the Action records every run and agent step to the orchestrator database.'
    required: false
  supabase-secret-key:
    description: 'Supabase service-role key. Only needed when supabase-url is set. Bypasses RLS to write run telemetry.'
    required: false

runs:
  using: 'node20'
  main: 'dist/index.js'
